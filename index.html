<script>
    // Funzione per estrarre la categoria dal URL
    function ottieniCategoriaDalURL() {
        const pathSegments = window.location.pathname.split('/').filter(s => s);
        if (pathSegments.length > 0 && pathSegments[0] !== 'page') {
            return pathSegments[0]; // 'puzzle', 'sparabolle', 'arcade', ecc.
        }
        return 'spc'; // categoria default (home)
    }

    // Funzione per ottenere il numero pagina
    function ottieniNumeroPagina() {
        let pagina = "1";
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('paged')) {
            pagina = urlParams.get('paged');
        } else {
            const pathSegments = window.location.pathname.split('/');
            const pageIndex = pathSegments.indexOf('page');
            if (pageIndex !== -1 && pathSegments[pageIndex + 1]) {
                pagina = pathSegments[pageIndex + 1];
            }
        }
        return pagina;
    }

    // Scorrimento freccette
    window.scorriMieiRecenti = function (direzione) {
        const lista = document.getElementById('lista-recenti-spc');
        if (lista) {
            lista.scrollLeft += (direzione * 160);
        }
    };

    // Al caricamento della pagina
    document.addEventListener("DOMContentLoaded", function () {
        const categoria = ottieniCategoriaDalURL();
        const numeroPagina = ottieniNumeroPagina();
        const chiaveStorage = 'recenti_playcombo_' + categoria + '_' + numeroPagina;

        // RENDER BLOCCO RECENTI
        try {
            let recenti = JSON.parse(localStorage.getItem(chiaveStorage)) || [];
            const container = document.getElementById('blocco-recenti-spc');
            const listaRecenti = document.getElementById('lista-recenti-spc');
            const fSx = document.getElementById('freccia-sx-recenti');
            const fDx = document.getElementById('freccia-dx-recenti');

            if (recenti.length > 0 && container && listaRecenti) {
                container.style.display = 'block';
                listaRecenti.innerHTML = '';

                // Freccette visibili solo se più di 5 giochi salvati
                if (recenti.length > 5 && fSx && fDx) {
                    fSx.style.display = 'flex';
                    fDx.style.display = 'flex';
                }

                recenti.forEach(function (gioco) {
                    const div = document.createElement('div');
                    div.className = 'nodo-recente-spc';
                    div.title = gioco.titolo || 'Gioca';

                    const img = document.createElement('img');
                    img.src = gioco.img || '';
                    img.alt = gioco.titolo || 'Gioco';
                    img.loading = "lazy"; // <--- AGGIUNGI QUESTA RIGA QUI!
                    img.width = 75;
                    img.height = 75;

                    div.onclick = function () {
                        if (typeof window.apriAnteprima === 'function') {
                            window.apriAnteprima(gioco);
                        }
                    };

                    div.appendChild(img);
                    listaRecenti.appendChild(div);
                });
            }
        } catch (e) {
            console.error("Errore render recenti:", e);
        }

        // SALVATAGGIO QUANDO SI AVVIA UN GIOCO
        const btnAvvia = document.getElementById('btn-avvia');
        if (btnAvvia) {
            btnAvvia.addEventListener('click', function () {
                try {
                    const spazioInfo = document.getElementById('spazio-info');
                    if (!spazioInfo) return;

                    const h3 = spazioInfo.querySelector('h3');
                    if (!h3) return;

                    const titoloGioco = h3.textContent;

                    let giocoTrovato = null;
                    if (window.listaGiochi && Array.isArray(window.listaGiochi)) {
                        giocoTrovato = window.listaGiochi.find(function (g) {
                            return g.titolo === titoloGioco;
                        });
                    }

                    if (giocoTrovato) {
                        let recenti = JSON.parse(localStorage.getItem(chiaveStorage)) || [];

                        // Rimuovi eventuale duplicato
                        recenti = recenti.filter(function (g) {
                            return g.titolo !== giocoTrovato.titolo;
                        });

                        // Aggiungi in cima
                        recenti.unshift({
                            titolo: giocoTrovato.titolo,
                            img: giocoTrovato.img,
                            url: giocoTrovato.url
                        });

                        // Massimo 20 giochi salvati per categoria
                        if (recenti.length > 20) recenti.pop();

                        localStorage.setItem(chiaveStorage, JSON.stringify(recenti));
                    }
                } catch (e) {
                    console.error("Errore salvataggio recenti:", e);
                }
            }, { passive: true });
        }
    });
</script>
