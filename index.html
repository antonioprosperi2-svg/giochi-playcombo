<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayCombo Professional Arcade</title>
<style>
    .contenitore-arcade-spc {
        width: 100% !important;
        margin: 0 auto;
        padding: 10px;
        box-sizing: border-box;
        font-family: sans-serif;
    }

    .sezione-ricerca-spc {
        display: flex;
        justify-content: center;
        margin-bottom: 15px;
        padding: 0 10px;
    }

    .input-ricerca-spc {
        width: 100% !important;
        max-width: 500px !important;
        padding: 14px 20px !important;
        font-size: 16px !important;
        border: 2px solid rgba(255, 255, 255, 0.5) !important;
        border-radius: 50px !important;
        outline: none !important;
        background: rgba(255, 255, 255, 0.15) !important;
        color: #ffffff !important;
        backdrop-filter: blur(8px) !important;
        -webkit-backdrop-filter: blur(8px) !important;
        transition: border-color 0.3s, box-shadow 0.3s !important;
        box-sizing: border-box !important;
    }

    .input-ricerca-spc::placeholder {
        color: rgba(255, 255, 255, 0.7) !important;
    }

    .input-ricerca-spc:focus {
        border-color: #00aaff !important;
        box-shadow: 0 4px 12px rgba(0, 170, 255, 0.3) !important;
        background: rgba(255, 255, 255, 0.2) !important;
    }

    .box-selezione-spc {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
        padding: 0 10px;
    }

    #select-categoria-spc {
        width: 100%;
        max-width: 500px;
        padding: 14px 20px;
        font-size: 16px;
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 50px;
        outline: none;
        background: rgba(255, 255, 255, 0.15);
        background-color: rgba(255, 255, 255, 0.15) !important;
        color: #ffffff;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
        box-sizing: border-box;
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    #select-categoria-spc:focus {
        border-color: #00aaff;
        box-shadow: 0 4px 12px rgba(0, 170, 255, 0.3);
    }

    #select-categoria-spc option {
        background: #1a1a2e;
        color: #ffffff;
    }

    /* === GIOSTRA DEI RECENTI === */
    .sezione-recenti-spc {
        width: 100%;
        max-width: 500px;
        margin: 0 auto 25px auto;
        padding: 15px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-sizing: border-box;
    }

    .titolo-recenti-spc {
        color: #ffffff;
        font-size: 15px;
        margin: 0 0 12px 0;
        font-weight: bold;
        text-align: left;
        opacity: 0.9;
        letter-spacing: 0.5px;
    }

    .giostra-recenti-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
        position: relative;
    }

    .lista-recenti-scroll {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 5px;
        scroll-behavior: smooth;
        scrollbar-width: none;
        -ms-overflow-style: none;
        flex: 1;
    }

    .lista-recenti-scroll::-webkit-scrollbar {
        display: none;
    }

    /* Freccette trasparenti come il resto */
    .btn-freccia-recenti {
        background: rgba(255, 255, 255, 0.15);
        color: #ffffff !important;
        border: 2px solid rgba(255, 255, 255, 0.5);
        width: 35px;
        height: 35px;
        border-radius: 50%;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        transition: transform 0.2s, background 0.2s, border-color 0.3s;
        flex-shrink: 0;
    }

    .btn-freccia-recenti:hover {
        transform: scale(1.1);
        background: rgba(255, 255, 255, 0.25);
        border-color: #00aaff;
    }

    .nodo-recente-spc {
        flex: 0 0 75px;
        cursor: pointer;
        transition: transform 0.2s ease;
        position: relative;
    }

    .nodo-recente-spc:hover {
        transform: scale(1.05);
    }

    .nodo-recente-spc img {
        width: 75px;
        height: 75px;
        object-fit: cover;
        border-radius: 14px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        display: block;
    }

    /* ========================== */

    .griglia-giochi-spc {
        display: grid !important;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)) !important;
        gap: 10px !important;
        padding: 10px !important;
        width: 100% !important;
        min-height: 50vh;
        box-sizing: border-box;
        background-color: transparent !important;
    }

    .scheda-gioco-figura {
        cursor: pointer;
        position: relative;
        transition: transform 0.3s ease;
    }

    .scheda-gioco-figura img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 12px;
        display: block;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
    }

    .scheda-gioco-figura:hover {
        transform: translateY(-5px) scale(1.03);
    }

    .scheda-gioco-figura:hover img {
        box-shadow: 0 8px 16px rgba(0, 119, 190, 0.3);
    }

    .paginazione-spc {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        gap: 8px !important;
        margin: 40px 0 !important;
        font-family: sans-serif !important;
        flex-wrap: nowrap !important;
        width: 100% !important;
        padding: 0 5px;
        box-sizing: border-box;
    }

    .btn-paginazione {
        background-color: #ff9900 !important;
        color: white !important;
        border: none !important;
        padding: 10px 16px !important;
        font-size: 14px !important;
        font-weight: bold !important;
        border-radius: 50px !important;
        cursor: pointer !important;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1) !important;
        transition: transform 0.3s ease, background 0.2s !important;
        flex-shrink: 0 !important;
    }

    .btn-paginazione:hover:not(:disabled) {
        transform: scale(1.05) !important;
        background-color: #e08800 !important;
    }

    .btn-paginazione:disabled {
        background-color: #ccc !important;
        cursor: not-allowed !important;
        box-shadow: none !important;
    }

    #info-pagina {
        display: inline-flex !important;
        justify-content: center !important;
        align-items: center !important;
        gap: 5px !important;
        flex-wrap: nowrap !important;
        max-width: 70vw !important;
    }

    #info-pagina button,
    #info-pagina strong,
    #info-pagina span {
        display: inline-flex !important;
        justify-content: center !important;
        align-items: center !important;
        width: 34px !important;
        height: 34px !important;
        border-radius: 50% !important;
        font-size: 14px !important;
        font-weight: bold !important;
        font-family: sans-serif !important;
        margin: 0 !important;
        transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease !important;
        box-sizing: border-box !important;
        flex-shrink: 0 !important;
    }

    #info-pagina strong,
    #info-pagina .pagina-attiva {
        background-color: #ff9900 !important;
        color: #000000 !important;
        box-shadow: 0 4px 8px rgba(255, 153, 0, 0.4) !important;
        cursor: default !important;
        border: none !important;
    }

    #info-pagina button,
    #info-pagina .pagina-button {
        background-color: rgba(255, 255, 255, 0.2) !important;
        color: #ffffff !important;
        border: 1px solid rgba(255, 255, 255, 0.3) !important;
        cursor: pointer !important;
    }

    #info-pagina button:hover,
    #info-pagina .pagina-button:hover {
        transform: scale(1.1) !important;
        background-color: #0077be !important;
        color: #ffffff !important;
        border-color: #0077be !important;
    }

    #info-pagina span.puntini {
        border: none !important;
        background: transparent !important;
        color: rgba(255, 255, 255, 0.6) !important;
        cursor: default !important;
        width: auto !important;
        height: auto !important;
    }

    /* CORNICE GIOCATORE */
    #cornice-gioco {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0077be, #00aaff);
        z-index: 999999;
        flex-direction: column;
        overflow-y: auto;
    }

    #area-contenuto {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        padding: 20px;
        color: white;
        text-align: center;
    }

    .pulsante-chiudi {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.3);
        color: white;
        border: none;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        font-size: 28px;
        cursor: pointer;
        z-index: 9999999;
    }

    .btn-gioca {
        background: #ff9900;
        color: white;
        padding: 15px 30px;
        border: none;
        border-radius: 50px;
        font-size: 18px;
        font-weight: bold;
        margin-top: 20px;
        cursor: pointer;
    }

    #spazio-gioco {
        width: 100%;
        height: 100%;
        background-color: #0077be;
        display: none;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    #spazio-gioco iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    #spazio-info h3 {
        font-size: 24px;
        margin-bottom: 15px;
    }

    #box-descrizione {
        font-size: 20px;
        line-height: 1.6;
    }
</style>

</div>

<script>
    // Funzione per estrarre la categoria dal URL
    function ottieniCategoriaDalURL() {
        const pathSegments = window.location.pathname.split('/').filter(s => s);
        if (pathSegments.length > 0 && pathSegments[0] !== 'page') {
            return pathSegments[0]; // 'puzzle', 'sparabolle', 'arcade', ecc.
        }
        return 'spc'; // categoria default (home)
    }

    // Funzione per ottenere il numero pagina
    function ottieniNumeroPagina() {
        let pagina = "1";
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('paged')) {
            pagina = urlParams.get('paged');
        } else {
            const pathSegments = window.location.pathname.split('/');
            const pageIndex = pathSegments.indexOf('page');
            if (pageIndex !== -1 && pathSegments[pageIndex + 1]) {
                pagina = pathSegments[pageIndex + 1];
            }
        }
        return pagina;
    }

    // Scorrimento freccette
    window.scorriMieiRecenti = function (direzione) {
        const lista = document.getElementById('lista-recenti-spc');
        if (lista) {
            lista.scrollLeft += (direzione * 160);
        }
    };

    // Al caricamento della pagina
    document.addEventListener("DOMContentLoaded", function () {
        const categoria = ottieniCategoriaDalURL();
        const numeroPagina = ottieniNumeroPagina();
        const chiaveStorage = 'recenti_playcombo_' + categoria + '_' + numeroPagina;

        // RENDER BLOCCO RECENTI
        try {
            let recenti = JSON.parse(localStorage.getItem(chiaveStorage)) || [];
            const container = document.getElementById('blocco-recenti-spc');
            const listaRecenti = document.getElementById('lista-recenti-spc');
            const fSx = document.getElementById('freccia-sx-recenti');
            const fDx = document.getElementById('freccia-dx-recenti');

            if (recenti.length > 0 && container && listaRecenti) {
                container.style.display = 'block';
                listaRecenti.innerHTML = '';

                // Freccette visibili solo se più di 5 giochi salvati
                if (recenti.length > 5 && fSx && fDx) {
                    fSx.style.display = 'flex';
                    fDx.style.display = 'flex';
                }

                recenti.forEach(function (gioco) {
                    const div = document.createElement('div');
                    div.className = 'nodo-recente-spc';
                    div.title = gioco.titolo || 'Gioca';

                    const img = document.createElement('img');
                    img.src = gioco.img || '';
                    img.alt = gioco.titolo || 'Gioco';

                    div.onclick = function () {
                        if (typeof window.apriAnteprima === 'function') {
                            window.apriAnteprima(gioco);
                        }
                    };

                    div.appendChild(img);
                    listaRecenti.appendChild(div);
                });
            }
        } catch (e) {
            console.error("Errore render recenti:", e);
        }

        // SALVATAGGIO QUANDO SI AVVIA UN GIOCO
        const btnAvvia = document.getElementById('btn-avvia');
        if (btnAvvia) {
            btnAvvia.addEventListener('click', function () {
                try {
                    const spazioInfo = document.getElementById('spazio-info');
                    if (!spazioInfo) return;

                    const h3 = spazioInfo.querySelector('h3');
                    if (!h3) return;

                    const titoloGioco = h3.textContent;

                    let giocoTrovato = null;
                    if (window.listaGiochi && Array.isArray(window.listaGiochi)) {
                        giocoTrovato = window.listaGiochi.find(function (g) {
                            return g.titolo === titoloGioco;
                        });
                    }

                    if (giocoTrovato) {
                        let recenti = JSON.parse(localStorage.getItem(chiaveStorage)) || [];

                        // Rimuovi eventuale duplicato
                        recenti = recenti.filter(function (g) {
                            return g.titolo !== giocoTrovato.titolo;
                        });

                        // Aggiungi in cima
                        recenti.unshift({
                            titolo: giocoTrovato.titolo,
                            img: giocoTrovato.img,
                            url: giocoTrovato.url
                        });

                        // Massimo 20 giochi salvati per categoria
                        if (recenti.length > 20) recenti.pop();

                        localStorage.setItem(chiaveStorage, JSON.stringify(recenti));
                    }
                } catch (e) {
                    console.error("Errore salvataggio recenti:", e);
                }
            }, { passive: true });
        }
    });
</script>
