<script>
    // Funzione per estrarre la categoria dal URL
    function ottieniCategoriaDalURL() {
        const pathSegments = window.location.pathname.split('/').filter(s => s);
        if (pathSegments.length > 0 && pathSegments[0] !== 'page') {
            return pathSegments[0]; // 'puzzle', 'sparabolle', 'arcade', ecc.
        }
        return 'spc'; // categoria default (home)
    }

    function testoCategoria(slug) {
        const testi = {

                titolo: "Giochi 2048",

            }
        };
        return testi[(slug || "spc").toLowerCase()] || testi.spc;
    }

    // Scorrimento freccette
    window.scorriMieiRecenti = function (direzione) {
        const lista = document.getElementById('lista-recenti-spc');
        if (lista) {
            lista.scrollLeft += (direzione * 160);
        }
    };

    // Al caricamento della pagina
    document.addEventListener("DOMContentLoaded", function () {
        const categoria = ottieniCategoriaDalURL();
        const chiaveStorage = 'recenti_playcombo_' + categoria;
        const testo = testoCategoria(categoria);
        const titoloCategoria = document.getElementById('titolo-categoria-spc');
        const introCategoria = document.getElementById('intro-categoria-spc');
        if (titoloCategoria) titoloCategoria.textContent = testo.titolo;
        if (introCategoria) introCategoria.textContent = testo.testo;

        // RENDER BLOCCO RECENTI
        try {
            let recenti = JSON.parse(localStorage.getItem(chiaveStorage)) || [];
            const container = document.getElementById('blocco-recenti-spc');
            const listaRecenti = document.getElementById('lista-recenti-spc');
            const fSx = document.getElementById('freccia-sx-recenti');
            const fDx = document.getElementById('freccia-dx-recenti');

            if (recenti.length > 0 && container && listaRecenti) {
                container.style.display = 'block';
                listaRecenti.innerHTML = '';

                // Freccette visibili solo se più di 5 giochi salvati
                if (recenti.length > 5 && fSx && fDx) {
                    fSx.style.display = 'flex';
                    fDx.style.display = 'flex';
                }

                recenti.forEach(function (gioco) {
                    const div = document.createElement('div');
                    div.className = 'nodo-recente-spc';
                    div.title = gioco.titolo || 'Gioca';

                    const img = document.createElement('img');
                    img.src = gioco.img || '';
                    img.alt = gioco.titolo || 'Gioco';

                    div.onclick = function () {
                        if (typeof window.apriAnteprima === 'function') {
                            window.apriAnteprima(gioco);
                        }
                    };

                    div.appendChild(img);
                    listaRecenti.appendChild(div);
                });
            }
        } catch (e) {
            console.error("Errore render recenti:", e);
        }

        // SALVATAGGIO QUANDO SI AVVIA UN GIOCO (funziona con e senza id)
        const btnAvvia = document.getElementById('btn-avvia');
        if (btnAvvia) {
            btnAvvia.addEventListener('click', function () {
                try {
                    const g = window.giocoCorrente;
                    if (!g) return;
                    const chiave = function (x) { return x.id || x.url || x.titolo; };
                    const k = chiave(g);
                    if (!k) return;

                    let recenti = JSON.parse(localStorage.getItem(chiaveStorage)) || [];
                    recenti = recenti.filter(function (x) { return chiave(x) !== k; });
                    recenti.unshift({ id: g.id || '', titolo: g.titolo, img: g.img, url: g.url, desc: g.desc || '' });
                    if (recenti.length > 20) recenti.length = 20;
                    localStorage.setItem(chiaveStorage, JSON.stringify(recenti));
                } catch (e) {
                    console.error("Errore salvataggio recenti:", e);
                }
            }, { passive: true });
        }
    });
</script>

<script>
    // La barra ricerca + categoria resta visibile in alto per TUTTA la pagina, footer compreso.
    // Lo "sticky" dura quanto il contenitore in cui sta: la porto quindi direttamente dentro <body>,
    // subito prima del contenitore principale della pagina (nel tema e' #page).
    (function () {
        function spostaBarra() {
            var barra = document.querySelector('.barra-fissa-spc');
            var blocco = document.querySelector('.contenitore-arcade-spc');
            if (!barra || !blocco || barra.classList.contains('barra-spostata-spc')) return;
            var alto = blocco;
            while (alto.parentNode && alto.parentNode !== document.body) alto = alto.parentNode;
            if (!alto.parentNode) return;
            document.body.insertBefore(barra, alto);
            barra.classList.add('barra-spostata-spc');
        }

        // Quando si apre l'anteprima o il gioco, la barra si nasconde
        function osservaGioco() {
            var cornice = document.getElementById('cornice-gioco');
            if (!cornice || typeof MutationObserver === 'undefined') return;
            var aggiorna = function () {
                var aperta = window.getComputedStyle(cornice).display !== 'none';
                document.documentElement.classList.toggle('gioco-aperto-spc', aperta);
            };
            new MutationObserver(aggiorna).observe(cornice, { attributes: true, attributeFilter: ['style', 'class'] });
            aggiorna();
        }

        function avvia() {
            // spostaBarra();
            osservaGioco();
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', avvia);
        } else {
            avvia();
        }
    })();
</script>
